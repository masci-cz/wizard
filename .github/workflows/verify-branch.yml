name: Verify on Branch

on:
  push:
    branches-ignore:
      - master

jobs:
  verify:
    name: Verify Maven package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Maven package
        run: mvn verify --no-transfer-progress
