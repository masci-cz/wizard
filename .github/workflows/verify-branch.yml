name: Verify on Branch

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!master'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Maven package
        run: mvn --batch-mode --update-snapshots verify
